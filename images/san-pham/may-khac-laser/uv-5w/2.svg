<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="uvBeam2" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#b794f4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6b46c1" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glowUV2" cx="0.5" cy="0.6" r="0.4">
      <stop offset="0%" stop-color="#9f7aea" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#6b46c1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1a202c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000044"/>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="800" height="600" fill="url(#bgGrad2)"/>

  <!-- UV glow effect -->
  <circle cx="380" cy="320" r="200" fill="url(#glowUV2)" filter="url(#glow)"/>

  <!-- Laser head (top) -->
  <rect x="340" y="60" width="80" height="50" rx="8" fill="#4a5568" stroke="#718096" stroke-width="1.5"/>
  <rect x="355" y="75" width="50" height="20" rx="4" fill="#2d3748"/>
  <text x="380" y="89" text-anchor="middle" fill="#b794f4" font-family="Arial,sans-serif" font-size="9" font-weight="bold">UV 355nm</text>
  <!-- Lens -->
  <circle cx="380" cy="115" r="10" fill="#2d3748" stroke="#718096" stroke-width="1.5"/>
  <circle cx="380" cy="115" r="5" fill="#9f7aea" filter="url(#glow)"/>

  <!-- UV Laser beam -->
  <polygon points="375,125 385,125 392,370 368,370" fill="url(#uvBeam2)"/>
  <line x1="380" y1="125" x2="380" y2="370" stroke="#b794f4" stroke-width="1" opacity="0.6"/>

  <!-- Glass plate -->
  <rect x="260" y="370" width="240" height="125" rx="8" fill="#edf2f7" stroke="#cbd5e0" stroke-width="2" filter="url(#softShadow)"/>
  <!-- Glass reflection -->
  <rect x="270" y="378" width="100" height="40" rx="4" fill="white" opacity="0.15"/>

  <!-- Frost marks on glass (cold marking effect) -->
  <text x="380" y="420" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16" font-weight="bold" opacity="0.9">MINH QUANG</text>
  <rect x="320" y="435" width="120" height="2" rx="1" fill="#e2e8f0" opacity="0.6"/>
  <text x="380" y="455" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="10" opacity="0.7">COLD MARKING</text>
  <text x="380" y="472" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="9" opacity="0.5">355nm · NO HEAT</text>

  <!-- Laser spot on glass -->
  <circle cx="380" cy="395" r="3" fill="#b794f4" filter="url(#glow)"/>
  <circle cx="380" cy="395" r="8" fill="#b794f4" opacity="0.3" filter="url(#glow)"/>

  <!-- Temperature indicator NO HEAT -->
  <rect x="550" y="370" width="120" height="40" rx="8" fill="#1a202c" stroke="#48bb78" stroke-width="1.5"/>
  <text x="610" y="388" text-anchor="middle" fill="#48bb78" font-family="monospace" font-size="9">TEMP: 25°C</text>
  <text x="610" y="402" text-anchor="middle" fill="#48bb78" font-family="Arial,sans-serif" font-size="10" font-weight="bold">NO HEAT ✓</text>

  <!-- Particle effects - cold sparks -->
  <circle cx="370" cy="400" r="1.5" fill="#b794f4" opacity="0.6"/>
  <circle cx="390" cy="408" r="1" fill="#b794f4" opacity="0.5"/>
  <circle cx="375" cy="410" r="1.2" fill="#d6bcfa" opacity="0.4"/>
  <circle cx="385" cy="398" r="0.8" fill="#d6bcfa" opacity="0.5"/>
  <circle cx="378" cy="405" r="1" fill="#b794f4" opacity="0.6"/>

  <!-- Magnification inset -->
  <rect x="60" y="370" width="170" height="125" rx="8" fill="#2d3748" stroke="#718096" stroke-width="1"/>
  <rect x="80" y="385" width="130" height="95" rx="4" fill="#1a202c"/>
  <!-- Magnified text -->
  <text x="145" y="415" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="20" font-weight="bold">±0.01mm</text>
  <rect x="100" y="430" width="90" height="1.5" rx="1" fill="#48bb78"/>
  <text x="145" y="452" text-anchor="middle" fill="#a0aec0" font-family="Arial,sans-serif" font-size="9">ĐỘ CHÍNH XÁC</text>
  <text x="145" y="468" text-anchor="middle" fill="#a0aec0" font-family="Arial,sans-serif" font-size="9">KHÔNG BIẾN DẠNG</text>

  <!-- Labels -->
  <rect x="280" y="530" width="240" height="40" rx="20" fill="#553c9a" opacity="0.8"/>
  <text x="400" y="555" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="13" font-weight="bold">KHẮC "LẠNH" · KHÔNG SINH NHIỆT</text>
</svg>
