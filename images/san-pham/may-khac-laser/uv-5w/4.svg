<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="drop4">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#00000018"/>
    </filter>
    <filter id="innerGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#805ad5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad4)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="55" fill="#2d3748"/>
  <text x="400" y="35" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="18" font-weight="bold">ỨNG DỤNG KHẮC LASER UV 5W / 355nm</text>

  <!-- Application Gallery Grid -->
  <!-- Card 1 -Glass -->
  <rect x="30" y="75" width="230" height="230" rx="10" fill="white" filter="url(#drop4)"/>
  <rect x="30" y="75" width="230" height="160" rx="10" fill="#e6f6ff"/>
  <!-- Glass bottle -->
  <rect x="100" y="90" width="50" height="120" rx="12" fill="white" stroke="#bee3f8" stroke-width="1.5" opacity="0.8"/>
  <rect x="105" y="100" width="40" height="65" rx="8" fill="white" stroke="#bee3f8" stroke-width="1" opacity="0.9"/>
  <rect x="115" y="80" width="20" height="15" rx="4" fill="white" stroke="#bee3f8" stroke-width="1"/>
  <!-- UV mark on glass -->
  <text x="125" y="145" text-anchor="middle" fill="#805ad5" font-family="Arial,sans-serif" font-size="7" opacity="0.8">LASER</text>
  <text x="125" y="155" text-anchor="middle" fill="#805ad5" font-family="Arial,sans-serif" font-size="7" opacity="0.8">UV MARK</text>
  <text x="145" y="240" text-anchor="middle" fill="#2d3748" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Thủy Tinh</text>
  <text x="145" y="258" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="9">Chai lọ, mặt kính</text>

  <!-- Card 2 - Plastic -->
  <rect x="285" y="75" width="230" height="230" rx="10" fill="white" filter="url(#drop4)"/>
  <rect x="285" y="75" width="230" height="160" rx="10" fill="#fefcbf"/>
  <!-- Plastic container -->
  <rect x="335" y="100" width="100" height="100" rx="8" fill="#faf089" stroke="#d69e2e" stroke-width="1.5"/>
  <rect x="360" y="110" width="50" height="15" rx="3" fill="#f6e05e"/>
  <text x="385" y="160" text-anchor="middle" fill="#805ad5" font-family="Arial,sans-serif" font-size="9" font-weight="bold">UV LOGO</text>
  <text x="400" y="240" text-anchor="middle" fill="#2d3748" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Nhựa</text>
  <text x="400" y="258" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="9">Bao bì, nắp chai, hộp</text>

  <!-- Card 3 - Electronics -->
  <rect x="540" y="75" width="230" height="230" rx="10" fill="white" filter="url(#drop4)"/>
  <rect x="540" y="75" width="230" height="160" rx="10" fill="#c6f6d5"/>
  <!-- Chip -->
  <rect x="600" y="100" width="60" height="60" rx="4" fill="#22543d" stroke="#48bb78" stroke-width="1"/>
  <circle cx="630" cy="130" r="20" fill="#276749" stroke="#48bb78" stroke-width="0.5"/>
  <rect x="608" y="105" width="6" height="6" fill="#68d391"/>
  <rect x="636" y="105" width="6" height="6" fill="#68d391"/>
  <rect x="608" y="148" width="6" height="6" fill="#68d391"/>
  <rect x="636" y="148" width="6" height="6" fill="#68d391"/>
  <!-- UV marks -->
  <text x="630" y="170" text-anchor="middle" fill="#805ad5" font-family="monospace" font-size="6" opacity="0.7">S/N:UV2024</text>
  <text x="655" y="240" text-anchor="middle" fill="#2d3748" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Điện Tử</text>
  <text x="655" y="258" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="9">IC, PCB, linh kiện</text>

  <!-- Card 4 - Ceramic -->
  <rect x="30" y="320" width="230" height="230" rx="10" fill="white" filter="url(#drop4)"/>
  <rect x="30" y="320" width="230" height="160" rx="10" fill="#fed7d7"/>
  <!-- Ceramic mug -->
  <path d="M 95 340 L 95 430 Q 95 440 105 440 L 175 440 Q 185 440 185 430 L 185 340" fill="white" stroke="#e53e3e" stroke-width="1.5" opacity="0.8"/>
  <path d="M 185 350 Q 200 355 200 370 Q 200 385 185 390" fill="none" stroke="#e53e3e" stroke-width="1.5" opacity="0.8"/>
  <text x="140" y="400" text-anchor="middle" fill="#805ad5" font-family="Arial,sans-serif" font-size="8" font-weight="bold">MQ TECH</text>
  <text x="145" y="490" text-anchor="middle" fill="#2d3748" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Ceramic</text>
  <text x="145" y="508" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="9">Cốc, gạch, sứ</text>

  <!-- Card 5 - Medical -->
  <rect x="285" y="320" width="230" height="230" rx="10" fill="white" filter="url(#drop4)"/>
  <rect x="285" y="320" width="230" height="160" rx="10" fill="#e9d8fd"/>
  <!-- Medical device -->
  <rect x="355" y="345" width="70" height="100" rx="8" fill="white" stroke="#9f7aea" stroke-width="1.5"/>
  <rect x="365" y="360" width="50" height="15" rx="3" fill="#d6bcfa"/>
  <rect x="365" y="385" width="50" height="8" rx="2" fill="#d6bcfa"/>
  <circle cx="390" cy="420" r="10" fill="#d6bcfa"/>
  <text x="400" y="490" text-anchor="middle" fill="#2d3748" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Y Tế</text>
  <text x="400" y="508" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="9">Dụng cụ phẫu thuật</text>

  <!-- Card 6 - Metal coating -->
  <rect x="540" y="320" width="230" height="230" rx="10" fill="white" filter="url(#drop4)"/>
  <rect x="540" y="320" width="230" height="160" rx="10" fill="#e2e8f0"/>
  <!-- Metal plate -->
  <rect x="580" y="350" width="120" height="80" rx="4" fill="#a0aec0" stroke="#718096" stroke-width="1.5"/>
  <rect x="590" y="358" width="100" height="12" rx="2" fill="#e2e8f0"/>
  <rect x="590" y="378" width="100" height="12" rx="2" fill="#e2e8f0"/>
  <rect x="590" y="398" width="100" height="12" rx="2" fill="#e2e8f0"/>
  <text x="640" y="395" text-anchor="middle" fill="#805ad5" font-family="Arial,sans-serif" font-size="7">UV ENGRAVED</text>
  <text x="655" y="490" text-anchor="middle" fill="#2d3748" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Kim Loại Phủ</text>
  <text x="655" y="508" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="9">Anodized, sơn phủ</text>

  <!-- Bottom banner -->
  <rect x="100" y="530" width="600" height="45" rx="22" fill="#2d3748"/>
  <text x="400" y="558" text-anchor="middle" fill="#9f7aea" font-family="Arial,sans-serif" font-size="14" font-weight="bold">VẬT LIỆU ĐA DẠNG · ỨNG DỤNG TOÀN DIỆN · UV 355nm COLD MARKING</text>
</svg>
